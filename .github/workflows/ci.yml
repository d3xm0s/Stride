name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build stride.exe
        run: make
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stride
          path: stride.exe
